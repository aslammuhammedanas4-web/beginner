<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>some clicks</title>
    <style>
        .uber-button {
            background-color: #000;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 10px;
            margin: 10px;
            cursor: pointer;
        }

        .amazon-button {
            background-color: rgb(255, 216, 20);
            color: #000;
            border: none;
            margin: 10px;
            height: 40px;
            width: 150px;
            border-radius: 20px;
            cursor: pointer;
        }

        .github-button {
            background-color: rgb(46, 164, 79);
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            border: none;
            margin: 10px;
            height: 30px;
            width: 80px;
            border-radius: 5px;
            cursor: pointer;
        }

        .bootstrap-one {
            background-color: rgb(121, 82, 179);
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            border: none;
            margin: 10px;
            height: 30px;
            width: 90px;
            border-radius: 3px;
        }

        .bootstrap-two {
            background-color: #fff;
            border: 1px solid rgb(108, 117, 125);
            color: rgb(108, 117, 125);
            margin: 10px;
            height: 30px;
            width: 90px;
            border-radius: 3px;
            font-weight: bold;
        }

        .linkdin-one {
            background-color: rgb(10, 102, 194);
            color: #fff;
            border: none;
            margin: 10px;
            font-weight: bold;
            font-size: 13px;
            height: 30px;
            width: 200px;
            border-radius: 15px;
        }
        .linkdin-two {
            background-color: #fff;
            border: 1px solid rgb(108, 117, 125);
            color: rgb(10,102,194);
            font-weight: bold;
             height: 30px;
            width: 70px;
            border-radius: 35px;
        }
            
    </style>
</head>

<body>
    <button class="uber-button">Request now</button>
    <br>
    <button class="amazon-button">Add to Cart</button>
    <br>
    <button class="github-button">Sign up</button>
    <br>
    <button class="bootstrap-one">Get Started</button>
    <button class="bootstrap-two">Download</button>
    <br>
    <button class="linkdin-one">Apply on company website</button>
    <button class="linkdin-two">Save</button>
</body>

</html>
