<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Qur'an Reader</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f1e8;
    color:#222;
    font-family:Arial, sans-serif;
}

    position:sticky;

<body>

<header>
    <h1>📖 القرآن الكريم</h1>
    <p>Offline Qur'an Reader</p>
</header>

<div class="controls">

    <button onclick="startAutoRead()">▶️ Auto Read</button>

    <button onclick="pauseAutoRead()">
        ⏸️ Pause
    </button>

    <button class="stop" onclick="stopAutoRead()">
        ⏹️ Stop
    </button>

    <div class="speed">
        <button onclick="changeSpeed(-1)">➖</button>
        <span id="speedValue">1.0x</span>
        <button onclick="changeSpeed(1)">➕</button>
    </div>

    <button onclick="changeFont(-2)">A−</button>
    <button onclick="changeFont(2)">A+</button>

    <button class="secondary" onclick="toggleDark()">
        🌙
    </button>

    <input
        id="search"
        class="searchBox"
        type="text"
        placeholder="🔎 Search Arabic text..."
        oninput="searchQuran()"
    >

</div>


<div id="reader" class="reader"></div>

<div id="status" class="status">
    Ready
</div>


<script>

/*
=========================================================
QUR'AN TEXT
=========================================================

Paste your Qur'an Arabic text inside this variable.

Format:

سورة الفاتحة
بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ
الرَّحْمَٰنِ الرَّحِيمِ
...

You can paste the complete text here.
=========================================================
*/

const quranText = `

سورة الفاتحة

بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ

الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ

الرَّحْمَٰنِ الرَّحِيمِ

مَالِكِ يَوْمِ الدِّينِ

إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ

اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ

صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ
غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ
وَلَا الضَّالِّينَ

`;


/* =========================
   APP VARIABLES
========================= */

let autoReading = false;
let paused = false;

let speed = 1;

let fontSize = 30;

let scrollTimer = null;

let currentPosition = 0;


/* =========================
   LOAD QURAN
========================= */

function loadQuran(){

    const reader = document.getElementById("reader");

    const lines = quranText
        .split("\n")
        .map(x => x.trim())
        .filter(x => x.length > 0);

    let html = "";

    let ayahNumber = 1;

    lines.forEach((line,index)=>{

        if(line.startsWith("سورة")){

            html += `
                <div class="surah">
                    <div class="surah-title">
                        ${line}
                    </div>
            `;

            ayahNumber = 1;

        }else{

            html += `
                <div class="ayah" data-text="${line}">
                    <span class="ayah-number">
                        ${ayahNumber}
                    </span>
                    ${line}
                </div>
            `;

            ayahNumber++;

        }

    });

    html += "</div>";

    reader.innerHTML = html;
}


/* =========================
   AUTO READING
========================= */

function startAutoRead(){

    if(autoReading && !paused){
        return;
    }

    autoReading = true;
    paused = false;

    document.getElementById("status").innerText =
        "▶️ Auto Reading";

    clearInterval(scrollTimer);

    /*
       Smaller interval = faster scrolling
    */

    scrollTimer = setInterval(()=>{

        if(!autoReading || paused){
            return;
        }

        window.scrollBy({
            top: speed,
            left: 0,
            behavior: "auto"
        });

        currentPosition = window.scrollY;

        if(
            window.innerHeight +
            window.scrollY >=
            document.body.offsetHeight - 5
        ){

            stopAutoRead();

        }

    },30);

}


/* =========================
   PAUSE
========================= */

function pauseAutoRead(){

    if(!autoReading){
        return;
    }

    paused = true;

    document.getElementById("status").innerText =
        "⏸️ Paused";

}


/* =========================
   STOP
========================= */

function stopAutoRead(){

    autoReading = false;
    paused = false;

    clearInterval(scrollTimer);

    document.getElementById("status").innerText =
        "⏹️ Stopped";

}


/* =========================
   SPEED
========================= */

function changeSpeed(value){

    speed += value * 0.5;

    if(speed < 0.5){
        speed = 0.5;
    }

    if(speed > 10){
        speed = 10;
    }

    document.getElementById("speedValue").innerText =
        speed.toFixed(1) + "x";

}


/* =========================
   FONT SIZE
========================= */

function changeFont(value){

    fontSize += value;

    if(fontSize < 18){
        fontSize = 18;
    }

    if(fontSize > 60){
        fontSize = 60;
    }

    document.querySelectorAll(".ayah").forEach(el=>{
        el.style.fontSize = fontSize + "px";
    });

}


/* =========================
   DARK MODE
========================= */

function toggleDark(){

    document.body.classList.toggle("dark");

}


/* =========================
   SEARCH
========================= */

function searchQuran(){

    const value =
        document.getElementById("search")
        .value
        .trim();

    const ayahs =
        document.querySelectorAll(".ayah");

    ayahs.forEach(ayah=>{

        ayah.classList.remove("highlight");

    });

    if(value === ""){
        return;
    }

    let firstMatch = null;

    ayahs.forEach(ayah=>{

        const text =
            ayah.getAttribute("data-text");

        if(text.includes(value)){

            ayah.classList.add("highlight");

            if(!firstMatch){
                firstMatch = ayah;
            }

        }

    });

    if(firstMatch){

        firstMatch.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    }

}


/* =========================
   KEYBOARD SHORTCUTS
========================= */

document.addEventListener("keydown",function(e){

    if(e.code === "Space"){

        e.preventDefault();

        if(!autoReading){

            startAutoRead();

        }else if(paused){

            startAutoRead();

        }else{

            pauseAutoRead();

        }

    }

    if(e.key === "Escape"){

        stopAutoRead();

    }

});


/* =========================
   SAVE FONT SIZE
========================= */

function saveSettings(){

    localStorage.setItem(
        "quranFontSize",
        fontSize
    );

}


/* =========================
   LOAD SETTINGS
========================= */

function loadSettings(){

    const saved =
        localStorage.getItem("quranFontSize");

    if(saved){

        fontSize = Number(saved);

    }

}


/* =========================
   SAVE ON CHANGE
========================= */

window.addEventListener("beforeunload",saveSettings);


/* =========================
   INITIALIZE
========================= */

loadSettings();

loadQuran();

setTimeout(()=>{

    document.querySelectorAll(".ayah").forEach(el=>{
        el.style.fontSize = fontSize + "px";
    });

},100);

</script>

</body>
</html>
