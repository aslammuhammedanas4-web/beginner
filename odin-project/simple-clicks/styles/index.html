<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fun Search 😄</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top bar */
        .top-bar {
            height: 60px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 25px;
            gap: 20px;
            font-size: 14px;
        }

        .top-bar a {
            color: #333;
            text-decoration: none;
        }

        .top-bar a:hover {
            text-decoration: underline;
        }

        .menu {
            font-size: 24px;
            cursor: pointer;
        }

        .profile {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #4285f4;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /* Main */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 150px;
        }

        /* Logo */
        .logo {
            font-size: 70px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .logo span:nth-child(1) {
            color: #4285f4;
        }

        .logo span:nth-child(2) {
            color: #ea4335;
        }

        .logo span:nth-child(3) {
            color: #fbbc05;
        }

        .logo span:nth-child(4) {
            color: #4285f4;
        }

        .logo span:nth-child(5) {
            color: #34a853;
        }

        .logo span:nth-child(6) {
            color: #ea4335;
        }

        /* Search */
        .search-container {
            width: 90%;
            max-width: 580px;
            position: relative;
        }

        .search-box {
            width: 100%;
            height: 48px;
            border: 1px solid #dfe1e5;
            border-radius: 30px;
            padding: 0 50px;
            font-size: 17px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.15);
        }

        .search-box:focus {
            box-shadow: 0 1px 8px rgba(32, 33, 36, 0.25);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 13px;
            font-size: 20px;
            color: #777;
        }

        .mic {
            position: absolute;
            right: 18px;
            top: 12px;
            font-size: 21px;
            cursor: pointer;
        }

        /* Buttons */
        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 12px;
        }

        button {
            border: 1px solid #f8f9fa;
            background: #f8f9fa;
            padding: 11px 18px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0,0,0,.1);
        }

        /* Result */
        #result {
            display: none;
            margin-top: 45px;
            text-align: center;
        }

        .emoji {
            font-size: 100px;
            animation: bounce 1s infinite alternate;
        }

        .result-text {
            margin-top: 15px;
            font-size: 22px;
            color: #333;
        }

        .small-text {
            margin-top: 8px;
            color: #777;
            font-size: 14px;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-15px);
            }
        }

        /* Footer */
        footer {
            background: #f2f2f2;
            color: #555;
            padding: 18px 30px;
            font-size: 14px;
            text-align: center;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .main {
                padding-top: 100px;
            }

            .logo {
                font-size: 55px;
            }

            .buttons {
                flex-direction: column;
            }

            .search-container {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <!-- Top -->
    <div class="top-bar">
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <span class="menu">⋮⋮</span>
        <div class="profile">A</div>
    </div>


    <!-- Main -->
    <div class="main">

        <div class="logo">
            <span>F</span><span>u</span><span>n</span><span>g</span><span>l</span><span>e</span>
        </div>


        <!-- Search -->
        <div class="search-container">

            <span class="search-icon">🔍</span>

            <input
                type="text"
                id="searchInput"
                class="search-box"
                placeholder="Search anything..."
                autocomplete="off"
            >

            <span class="mic">🎤</span>

        </div>


        <!-- Buttons -->
        <div class="buttons">

            <button onclick="searchFun()">
                Fun Search
            </button>

            <button onclick="surpriseMe()">
                I'm Feeling Lucky 🎲
            </button>

        </div>


        <!-- Result -->
        <div id="result">

            <div class="emoji" id="emoji">
                😂
            </div>

            <div class="result-text" id="resultText">
                You searched for something!
            </div>

            <div class="small-text">
                Sorry 😅 We only show fun emojis here!
            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer>
        Made with ❤️ using HTML, CSS & JavaScript
    </footer>


    <script>

        const input = document.getElementById("searchInput");

        const emojis = [
            "😂",
            "🤣",
            "😎",
            "🤔",
            "😱",
            "🥳",
            "🤩",
            "😆",
            "🙈",
            "🐱",
            "🐶",
            "🦄",
            "🚀",
            "🍕",
            "🔥",
            "💀",
            "👽",
            "🤖",
            "🎉",
            "❤️"
        ];


        function searchFun() {

            const query = input.value.trim();

            if (query === "") {

                alert("Please type something to search 😄");

                return;
            }


            // Random emoji
            const randomEmoji =
                emojis[Math.floor(Math.random() * emojis.length)];


            document.getElementById("emoji").textContent = randomEmoji;


            document.getElementById("resultText").textContent =
                `"${query}" searched! 😄`;


            document.getElementById("result").style.display = "block";
        }


        function surpriseMe() {

            const randomEmoji =
                emojis[Math.floor(Math.random() * emojis.length)];


            document.getElementById("emoji").textContent = randomEmoji;


            document.getElementById("resultText").textContent =
                "Surprise! You found a random emoji! 🎉";


            document.getElementById("result").style.display = "block";
        }


        // Press Enter to search
        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                searchFun();

            }

        });

    </script>

</body>
</html>
