<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .back-button {
            margin-right: 8px;
            margin-top: 8px;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .search-result {
            margin-left: 4px;
            margin-right: 4px;
            font-size: 15px;
        }

        .search-result:hover {
            background-color: rgb(11, 113, 11);
            color: white;
            padding: 5px 5px;
            border: none;
            transition: 0.15s;
        }

        .search-result:active {
            background-color: rgb(25, 18, 218);
            color: white;
            padding: 10px 10px;
            border: none;
            transition: 0.15s;
        }

        .next-button {
            margin-right: 8px;
            margin-top: 8px;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .first {
            background: rgb(11, 113, 11);
            color: white;
            padding: 10px 20px;
            border: none;
            margin: 20px;
        }

        .first:hover {
            background: rgb(11, 113, 11);
            color: white;
            padding: 20px 40px 20px 40px;
            border: none;
            transition: 0.15s;
        }

        .shadow {
            background: rgb(11, 113, 11);
            color: white;
            padding: 10px 20px;
            border: none;
            margin: 20px;
        }

        .shadow:hover {
            background: rgb(11, 113, 11);
            color: white;
            padding: 10px 20px;
            border: none;
            box-shadow: 2px 2px 8px rgb(0, 0, 0);
            transition: 0.15s;
        }

        .one {
            background: rgb(11, 113, 11);
            color: white;
            padding: 10px 20px;
            border: none;
            margin: 20px;
        }

        .two {
            background: rgb(11, 113, 11);
            color: white;
            padding: 10px 20px;
            border: none;
            margin: 20px;
        }

        .three {
            background: rgb(11, 113, 11);
            color: white;
            padding: 10px 20px;
            border: none;
            margin: 20px;
        }

        .hover:hover {
            background: rgb(11, 113, 11);
            color: white;
            cursor: pointer;
            padding: 10px 30px;
            border: none;
            transition: 0.15s;
        }
    </style>
</head>

<body>
    <button class="back-button">Back </button>
    <a class="search-result" href="https://google.com">1</a>
    <a class="search-result" href="https://google.com">2</a>
    <a class="search-result" href="https://google.com">3</a>
    <a class="search-result" href="https://google.com">4</a>
    <a class="search-result" href="https://google.com">5</a>

    <button class="next-button">Next</button>
    <br>
    <button class="first">Stretch</button>
    <br>
    <button class="shadow">shadow</button>
    <br>
    <button class="one hover">ONE</button>
    <button class="two hover">TWO</button>
    <button class="three hover">THREE</button>
</body>

</html>
