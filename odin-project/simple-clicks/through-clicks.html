<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>through clicks</title>
        <style>
            a:hover{
                color:rgb(224, 159, 46);

            }
            .first{
                color:rgb(0,118,0);
                font-weight:bold;
            }
            p{
                font-weight:bold;
            }
            .cart{
                background-color: rgb(255,216,20);
                color: #000;
                border: none;
                font-weight: bold;
                margin: 10px;
                height: 30px;
                width: 110px;
                border-radius: 156px;
                cursor:pointer;
            }
            .cart:active{
                opacity:0.7;
                transition:opacity 0.15s;
            }
            .buy{
                background-color: rgb(255,164,28);
                color: #000;
                border:none;
                font-weight:bold;
                height: 30px;
                width: 80px;
                border-radius:15px;
                cursor:pointer;
            }
            .buy:active{
                background-color: rgba(102, 112, 4, 0.826);
                color: #fff;
                transition: background-color 0.15s;
            }
            </style>
        </head>
        <body>
            <a href="index.html">back to home</a>
            <h1>Nike Black Running Shoes</h1>

            <p class="first">$39-in stock.</p>
            <p>Free delivery tomorrow.</p>
            
            <button class="cart">Add to Cart</button>
            <button class="buy">Buy Now</button>

            </body>
