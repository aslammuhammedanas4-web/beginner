<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>some clicks</title>
    <style>
        .uber-button {
            background-color: #000;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 10px;
            margin: 10px;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .uber-button:hover {
            opacity: 0.7;
        }

        .amazon-button {
            background-color: rgb(255, 216, 20);
            color: #000;
            border: none;
            margin: 10px;
            height: 40px;
            width: 150px;
            border-radius: 20px;
            cursor: pointer;
        }

        .amazon-button:hover {
            background-color: rgba(255, 216, 20, 0.837);
            transition: background-color 0.15s;
        }

        .amazon-button:active {
            background-color: rgba(255, 157, 20, 0.853);
            transition: background-color 0.15s;
            color: #fff;
        }

        .github-button {
            background-color: rgb(46, 164, 79);
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            border: none;
            margin: 10px;
            height: 30px;
            width: 80px;
            border-radius: 5px;
            cursor: pointer;
        }

        .github-button:hover {
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.2);
            transition: box-shadow 0.15s;

        }

        .bootstrap-one {
            background-color: rgb(121, 82, 179);
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            border: none;
            margin: 10px;
            height: 30px;
            width: 90px;
            border-radius: 3px;
            cursor: pointer;

        }

        .bootstrap-one:hover {
            background-color: rgba(81, 24, 168, 0.9);
            transition: background-color 0.15s;
        }

        .bootstrap-two {
            background-color: #fff;
            border: 1px solid rgb(108, 117, 125);
            color: rgb(108, 117, 125);
            margin: 10px;
            height: 30px;
            width: 90px;
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
        }

        .bootstrap-two:hover {
            background-color: rgba(119, 125, 108, 0.518);
            transition: background-color 0.15s;
            color: #fff;

        }

        .linkdin-one {
            background-color: rgb(10, 102, 194);
            color: #fff;
            border: none;
            margin: 10px;
            font-weight: bold;
            font-size: 13px;
            height: 30px;
            width: 200px;
            border-radius: 15px;
            cursor: pointer;
        }

        .linkdin-one:active {
            background-color: rgba(5, 82, 158, 0.9);
            transition: background-color 0.15s;

        }

        .linkdin-two {
            background-color: #fff;
            border: 1px solid rgb(108, 117, 125);
            color: rgb(10, 102, 194);
            font-weight: bold;
            height: 30px;
            width: 70px;
            border-radius: 35px;
            border-style: solid;
            border-color: rgb(10, 102, 194);
            cursor: pointer;
            transition: background-color 0.15s,
                border-color 0.15s;
        }

        .linkdin-two:active {
            background-color: rgb(226, 241, 255);
            border-width: 2px;
            border-color: rgb(5, 82, 158);
        }

        .youtube {
            background-color: rgb(227, 65, 64);
            color: #fff;
            border: none;
            margin: 10px;
            font-weight: bold;
            font-size: 13px;
            height: 30px;
            width: 70px;
            border-radius: 8px;
            cursor: pointer;

        }
        .google-button {
            background-color: rgb(241, 227, 227);
            color:rgba(175, 210, 130, 1.00);
            border: none;
            margin: 10px;
            font-weight: bold;
            font-size: 20px;
            height: 40px;
            width: 100px;
            border-radius: 8px;
            cursor: pointer;

        }

    </style>
</head>

<body>
    <button class="uber-button">Request now</button>
    <br>
    <a href="add-cart.html">
        <button class="amazon-button">Add to Cart</button>
    </a>
    <br>
    <button class="github-button">Sign up</button>
    <br>
    <button class="bootstrap-one">Get Started</button>
    <button class="bootstrap-two">Download</button>
    <br>
    <button class="linkdin-one">Apply on company website</button>
    <button class="linkdin-two">Save</button>
    <br>
    <a href="text.html">
        <button class="youtube">YouTube</button>
    </a>
    <br>
    <a href="google.html">
        <button class="google-button">Google</button>
    </a>
   
    <a href="../simple-clicks/styles/index_fun.html">
        <button class="google-button">Fun</button>
    </a>
    
</body>

</html>
